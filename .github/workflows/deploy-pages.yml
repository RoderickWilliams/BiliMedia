name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bilimedia-frontend/package-lock.json

      - name: Install root deps (@vercel/node imports)
        run: npm install --no-audit --no-fund

      - name: Install frontend deps
        working-directory: bilimedia-frontend
        run: npm install --no-audit --no-fund

      - name: Build (GitHub Pages target)
        working-directory: bilimedia-frontend
        env:
          PAGES_DEPLOY: '1'
        run: npm run build

      - name: SPA fallback: ensure 404.html matches index.html
        working-directory: bilimedia-frontend
        run: |
          if [ ! -f dist/404.html ] || ! diff dist/index.html dist/404.html >/dev/null 2>&1; then
            cp dist/index.html dist/404.html
          fi
        shell: bash

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: vite

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: bilimedia-frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
